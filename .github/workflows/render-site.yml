name: Render site

# Rebuild the whole site every Monday (Google Sheets, Strava, Scholar...)
# and on demand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC = 05:00 (winter) / 06:00 (summer) in Switzerland
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-site
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TZ: Europe/Zurich
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }} # for the renv packages installed from GitHub
      STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
      STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
      STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libjpeg-dev libtiff-dev \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libglpk-dev

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.25

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Render
        run: quarto render

      - name: Commit and push
        run: |
          git config user.name "cmaslard"
          git config user.email "158761458+cmaslard@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Weekly render ($(date +%F))"
          git pull --rebase origin main
          git push origin HEAD:main
